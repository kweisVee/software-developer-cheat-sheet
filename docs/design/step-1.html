<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ReviewPrep – Categories</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
a{text-decoration:none}
button{font-family:inherit}
.row{cursor:pointer;transition:background .15s}
.row:hover{background:#22304a}
.row:focus-visible,.add:focus-visible{outline:2px solid #8ab4f8;outline-offset:3px}
.add{transition:background .15s}
.add:hover{background:#3d68e8}
.q{transition:background .15s}
.q:hover{background:#22304a}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
</helmet>
<div style="min-height: 720px; box-sizing: border-box; background: #202124; padding: 32px 24px; color: #e8eaed">
<div style="max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">

<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 12px">
<div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 12px; background: #4f7cff; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
</div>
<span style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff">Review<span style="color: #8ab4f8">Prep</span></span>
</div>
<a class="add" href="#" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 0 20px; border-radius: 999px; background: #4f7cff; color: #ffffff; font-size: 15px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
Add Question
</a>
</header>

<main style="background: #0f172a; border-radius: 28px; padding: 40px; display: flex; flex-direction: column; gap: 28px; border: 1px solid #1e2a44">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8ab4f8">Browse by topic</span>
<h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; color: #ffffff">Categories</h1>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{categories}}" as="cat" hint-placeholder-count="6">
<section style="border-radius: 20px; background: #1a2438; border: 1px solid #2a3957; overflow: hidden">
<button class="row" type="button" onClick="{{ cat.toggle }}" aria-expanded="{{ cat.open }}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 72px; box-sizing: border-box; padding: 16px 24px; background: transparent; border: 0; color: #e8eaed; text-align: left">
<span style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
<span style="font-size: 20px; font-weight: 600; color: #ffffff">{{cat.name}}</span>
<span style="font-size: 14px; color: #a9b4c9">{{cat.countLabel}}</span>
</span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8ab4f8" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{ cat.chevronStyle }}"><path d="M6 9l6 6 6-6"/></svg>
</button>
<sc-if value="{{ cat.open }}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px solid #2a3957; background: #152036; padding: 12px; display: flex; flex-direction: column; gap: 16px">

<sc-if value="{{ cat.hasQuestions }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ cat.questions }}" as="q" hint-placeholder-count="2">
<div class="q" style="display: flex; align-items: flex-start; gap: 14px; padding: 14px 12px; border-radius: 12px">
<span style="flex: none; width: 28px; height: 28px; border-radius: 8px; background: #1f2f50; color: #8ab4f8; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{ q.num }}</span>
<span style="font-size: 16px; line-height: 1.5; color: #e8eaed; padding-top: 2px">{{ q.text }}</span>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ cat.hasSubs }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8ab4f8; padding: 0 12px">Sub-categories</span>
<sc-for list="{{ cat.subs }}" as="sub" hint-placeholder-count="2">
<div style="margin-left: 12px; border-radius: 16px; background: #1a2438; border: 1px solid #2a3957; overflow: hidden">
<button class="row" type="button" onClick="{{ sub.toggle }}" aria-expanded="{{ sub.open }}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; box-sizing: border-box; padding: 12px 20px; background: transparent; border: 0; color: #e8eaed; text-align: left">
<span style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
<span style="font-size: 17px; font-weight: 600; color: #ffffff">{{ sub.name }}</span>
<span style="font-size: 13px; color: #a9b4c9">{{ sub.countLabel }}</span>
</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8ab4f8" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{ sub.chevronStyle }}"><path d="M6 9l6 6 6-6"/></svg>
</button>
<sc-if value="{{ sub.open }}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px solid #2a3957; background: #152036; padding: 8px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ sub.questions }}" as="sq" hint-placeholder-count="2">
<div class="q" style="display: flex; align-items: flex-start; gap: 12px; padding: 12px 10px; border-radius: 10px">
<span style="flex: none; width: 26px; height: 26px; border-radius: 8px; background: #1f2f50; color: #8ab4f8; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{ sq.num }}</span>
<span style="font-size: 15px; line-height: 1.5; color: #e8eaed; padding-top: 2px">{{ sq.text }}</span>
</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>

</div>
</sc-if>
</section>
</sc-for>
</div>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { open: { Frontend: true, 'Frontend/CSS': true } };
}
renderVals() {
const data = [
{ name: 'Behavioral', questions: ['Tell me about a time you disagreed with a teammate.', 'Describe a bug you had to debug under pressure.', 'How do you handle feedback on your code?'], subs: [] },
{ name: 'Backend', questions: ['What is the difference between REST and GraphQL?'], subs: [
{ name: 'Java', questions: ['What is the difference between an interface and an abstract class?', 'How does garbage collection work?'] },
{ name: 'Spring Boot', questions: ['What does auto-configuration do?'] },
{ name: 'SQL', questions: ['How does a database index speed up a query?', 'What is the difference between INNER and LEFT JOIN?'] }
] },
{ name: 'Frontend', questions: ['How do you make a page accessible?', 'What happens when you type a URL into the browser?'], subs: [
{ name: 'HTML', questions: ['What is semantic HTML and why does it matter?'] },
{ name: 'CSS', questions: ['What is the CSS box model?', 'When would you use flexbox vs grid?'] },
{ name: 'JavaScript', questions: ['Explain event delegation.', 'What is a closure?'] }
] },
{ name: 'AI', questions: ['What is a large language model?', 'What is prompt engineering?'], subs: [] },
{ name: 'React', questions: ['What is the difference between state and props?', 'Why do list items need keys?'], subs: [
{ name: 'Hooks', questions: ['When does useEffect run?', 'What are the rules of hooks?'] }
] },
{ name: 'For Managers', questions: ['How do you prioritize competing projects?', 'How do you give difficult feedback?'], subs: [] }
];
const open = this.state.open;
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const chev = (o) => 'flex: none; transition: transform .2s; transform: rotate(' + (o ? 180 : 0) + 'deg)';
const list = (qs) => qs.map((t, i) => ({ num: i + 1, text: t }));
const toggle = (key) => () => this.setState({ open: { ...open, [key]: !open[key] } });
return {
categories: data.map((c) => {
const isOpen = !!open[c.name];
const total = c.questions.length + c.subs.reduce((n, s) => n + s.questions.length, 0);
let label = plural(total, 'question');
if (c.subs.length) label += ' · ' + plural(c.subs.length, 'sub-category').replace('categorys', 'categories');
return {
name: c.name,
open: isOpen,
countLabel: label,
chevronStyle: chev(isOpen),
hasQuestions: c.questions.length > 0,
hasSubs: c.subs.length > 0,
questions: list(c.questions),
toggle: toggle(c.name),
subs: c.subs.map((s) => {
const key = c.name + '/' + s.name;
const so = !!open[key];
return { name: s.name, open: so, countLabel: plural(s.questions.length, 'question'), chevronStyle: chev(so), questions: list(s.questions), toggle: toggle(key) };
})
};
})
};
}
}
</script>
</body>
</html>
